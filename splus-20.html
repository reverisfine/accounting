<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>회계실무 실습실 · 제20회 전산회계운용사 모의문제</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=IBM+Plex+Mono:wght@400;500;600&family=Jua&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3F6; --head:#E7F0F4; --head-2:#F3F7F9;
  --card:#FFFFFF; --card-2:#F5F7FA;
  --ink:#282D35; --ink-2:#5D656F; --ink-3:#9AA3AD;
  --rule:#E4E8EC; --rule-2:#F1F3F6;
  --brand:#4055E0; --brand-soft:#8F9CF0; --brand-bg:#EBEEFD;
  --teal:#32BFC0; --teal-bg:#E5F6F6;
  --tape-y:#FBE9A0; --tab-y:#FBF1C4; --tab-m:#CFE9E8;
  --debit:#4055E0; --debit-bg:#EBEEFD;
  --credit:#EE6A50; --credit-bg:#FDECE8;
  --ok:#1FA36E; --ok-bg:#E6F5EE;
  --no:#EE6A50; --no-bg:#FDECE8;
  --warn:#A07A10; --warn-bg:#FCF5DE;
  --rail:#4055E0;
  --shadow:0 1px 2px rgba(40,45,53,.04), 0 10px 24px -20px rgba(40,45,53,.5);
  --w:1180px; --side:206px; --gap:28px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111722; --head:#18212F; --head-2:#141C28;
    --card:#1A2130; --card-2:#222B3B;
    --ink:#EAEEF4; --ink-2:#A7B1BE; --ink-3:#78828F;
    --rule:#2B3447; --rule-2:#232B3A;
    --brand:#8C9CFF; --brand-soft:#5A6ACB; --brand-bg:#1F2743;
    --teal:#4FD3D3; --teal-bg:#153030;
    --tape-y:#8B7638; --tab-y:#3A3418; --tab-m:#1E3838;
    --debit:#8C9CFF; --debit-bg:#1F2743;
    --credit:#F08D74; --credit-bg:#36211B;
    --ok:#4FC391; --ok-bg:#132C22;
    --no:#F08D74; --no-bg:#36211B;
    --warn:#D6AC4A; --warn-bg:#2C2611;
    --rail:#8C9CFF;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 24px -20px #000;
  }
}
:root[data-theme="dark"]{
  --paper:#111722; --head:#18212F; --head-2:#141C28;
  --card:#1A2130; --card-2:#222B3B;
  --ink:#EAEEF4; --ink-2:#A7B1BE; --ink-3:#78828F;
  --rule:#2B3447; --rule-2:#232B3A;
  --brand:#8C9CFF; --brand-soft:#5A6ACB; --brand-bg:#1F2743;
  --teal:#4FD3D3; --teal-bg:#153030;
  --tape-y:#8B7638; --tab-y:#3A3418; --tab-m:#1E3838;
  --debit:#8C9CFF; --debit-bg:#1F2743;
  --credit:#F08D74; --credit-bg:#36211B;
  --ok:#4FC391; --ok-bg:#132C22;
  --no:#F08D74; --no-bg:#36211B;
  --warn:#D6AC4A; --warn-bg:#2C2611;
  --rail:#8C9CFF;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 24px -20px #000;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%;
  word-break:keep-all;overflow-wrap:break-word;line-break:strict}
input,select,textarea,button{word-break:keep-all;overflow-wrap:break-word}
.num,.amt,input.amt{font-family:"IBM Plex Mono","Noto Sans KR",monospace;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;line-height:1.35;margin:0;letter-spacing:-.01em}
a{color:var(--brand)}
button{font-family:inherit;font-size:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brand-soft);outline-offset:2px;border-radius:4px}
mark,.hl{background:linear-gradient(transparent 55%, var(--tape-y) 55%);color:inherit;padding:0 2px}

/* ---------- 상단 띠 ---------- */
header.top{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,var(--head) 0%,var(--head-2) 100%);border:0}
.foldtab{max-width:var(--w);margin:0 auto;padding:8px 20px 0;display:flex;align-items:flex-end}
.foldtab .tab{position:relative;display:inline-flex;align-items:center;height:30px;padding:0 16px;
  font-size:12.5px;line-height:1;border-radius:12px 14px 0 0;white-space:nowrap;text-decoration:none}
.foldtab .home{background:var(--card);color:var(--brand);font-weight:700;z-index:4}
.foldtab .home:hover{color:var(--ink)}
.foldtab .here{background:var(--card-2);color:var(--ink-2);height:26px;
  margin-left:-12px;padding:0 15px 0 23px;border-radius:0 14px 0 0;z-index:3}
.foldtab i{display:block;height:22px;margin-left:-13px;border-radius:0 14px 0 0}
.foldtab i.y{width:54px;background:var(--tab-y);z-index:2}
.foldtab i.m{width:48px;background:var(--tab-m);z-index:1}
.top-in{max-width:var(--w);margin:0 auto;padding:12px 16px 14px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto;min-width:0}
.brand b{font-family:"Jua",sans-serif;font-weight:400;font-size:22px;color:var(--brand);letter-spacing:-.01em}
.brand > span{font-size:12px;color:var(--ink-2)}
.brand b .hl{font-size:inherit;padding:0 4px;color:var(--ink)}
.firm{font-size:12px;color:var(--ink-2);background:var(--card);border:0;border-radius:999px;
  padding:6px 14px;white-space:nowrap;box-shadow:var(--shadow)}
.firm b{font-weight:700;color:var(--ink)}
.score{display:flex;align-items:baseline;gap:6px;white-space:nowrap;background:var(--brand);
  padding:4px 14px;border-radius:999px}
.score .n{font-family:"IBM Plex Mono",monospace;font-size:19px;font-weight:600;color:#fff}
.score .l{font-size:11.5px;color:rgba(255,255,255,.8)}
:root[data-theme="dark"] .score .n{color:#141B28}
:root[data-theme="dark"] .score .l{color:rgba(20,27,40,.7)}
.iconbtn{background:var(--card);border:0;color:var(--ink-2);border-radius:999px;padding:6px 13px;font-size:12.5px;box-shadow:var(--shadow)}
.iconbtn:hover{color:var(--brand)}
.bar{position:relative;height:20px;max-width:var(--w);margin:0 auto;padding:0 20px}
.bar::before{content:"";position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);height:12px;
  background:
    linear-gradient(var(--rail),var(--rail)) left center/1.5px 12px no-repeat,
    linear-gradient(var(--rail),var(--rail)) right center/1.5px 12px no-repeat,
    linear-gradient(var(--rail),var(--rail)) center/100% 1.5px no-repeat;
  opacity:.55}
.bar i{position:absolute;left:20px;top:50%;transform:translateY(-50%);height:1.5px;
  background:var(--rail);width:0;transition:width .35s ease}
.bar i::after{content:"◇●◇";position:absolute;right:0;top:50%;transform:translate(50%,-50%);
  font-size:10px;letter-spacing:.5px;color:var(--rail);background:var(--head);padding:0 3px;line-height:1}
header.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:var(--rule)}

/* ---------- 레이아웃 ---------- */
.shell{max-width:var(--w);margin:0 auto;padding:34px 20px 80px;display:grid;grid-template-columns:var(--side) 1fr;gap:var(--gap);align-items:start}
nav.steps{position:sticky;top:calc(var(--headH,124px) + 18px);
  max-height:calc(100vh - var(--headH,124px) - 36px);overflow-y:auto;overscroll-behavior:contain;
  padding:4px 6px 10px;margin:-4px -6px 0;scrollbar-width:thin}
nav.steps ol{list-style:none;margin:0;padding:0}
nav.steps li{margin:0 0 5px}
nav.steps button{width:100%;text-align:left;background:var(--card);border:0;border-radius:12px;
  padding:10px 14px;color:var(--ink-2);display:flex;gap:10px;align-items:baseline;font-size:13.5px;box-shadow:var(--shadow)}
nav.steps button .k{font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--brand-soft);font-weight:600}
nav.steps button:hover{color:var(--ink)}
nav.steps button[aria-current="true"]{background:var(--brand);color:#fff;font-weight:700}
nav.steps button[aria-current="true"] .k{color:rgba(255,255,255,.8)}
:root[data-theme="dark"] nav.steps button[aria-current="true"]{color:#141B28}
:root[data-theme="dark"] nav.steps button[aria-current="true"] .k{color:rgba(20,27,40,.7)}
nav.steps .tick{margin-left:auto;font-size:11.5px;color:var(--ok);font-family:"IBM Plex Mono",monospace}
nav.steps button[aria-current="true"] .tick{color:#fff}
@media(max-width:1023px){
  .shell{grid-template-columns:1fr;gap:16px;padding:22px 16px 70px}
  nav.steps{position:sticky;top:var(--headH,124px);z-index:30;background:var(--paper);overflow-x:auto;overflow-y:hidden;max-height:none;padding:8px 0 6px;margin:-8px 0 0}
  nav.steps ol{display:flex;gap:6px;min-width:max-content}
  nav.steps button{white-space:nowrap;padding:9px 15px}
  nav.steps .tick{display:none}
}
/* 넓은 데스크톱 화면 */
@media(min-width:1440px){
  :root{--w:1330px; --side:224px; --gap:34px}
  body{font-size:16px}
  .lede h2{font-size:32px}
  .lede.hero h2{font-size:42px}
  .q .qt{font-size:16.5px}
}
@media(min-width:1800px){ :root{--w:1440px} }
/* 태블릿 가로 (사이드바는 유지하되 여백 축소) */
@media(min-width:1024px) and (max-width:1300px){
  :root{--side:190px; --gap:22px}
}
/* 터치 화면 : 손가락으로 누를 수 있는 크기 */
@media (pointer:coarse){
  body{font-size:16px}
  select,input[type="text"],input[type="number"]{min-height:46px;font-size:16px}
  textarea{font-size:16px}
  table.rep textarea,table.rep select{min-height:0;font-size:14px}
  .btn{padding:12px 26px;font-size:15px}
  .btn.ghost,.iconbtn,.copy,.caseSel button{padding:11px 20px;font-size:14px}
  .opt{padding:14px 15px;font-size:15px}
  .opt input{transform:scale(1.25);margin-top:6px}
  .check{padding:12px 0;font-size:15px}
  .addrow{padding:11px 10px;font-size:14px}
  nav.steps button{padding:12px 18px;font-size:15px}
  .rowdel{padding:10px 12px;font-size:19px}
  input[type="range"]{height:34px}
}

/* ---------- 섹션 머리 ---------- */
.chtape{display:inline-block;font-family:"IBM Plex Mono",monospace;font-weight:600;font-size:12px;
  letter-spacing:.08em;color:var(--brand);background:var(--brand-bg);padding:4px 14px;border-radius:999px;margin-bottom:12px}
.lede{padding:0;margin:0 0 26px;text-align:left}
.lede.hero{text-align:center;padding:14px 0 6px;margin-bottom:30px}
.lede.hero h2{font-size:38px;line-height:1.28}
.lede.hero p{margin-left:auto;margin-right:auto;text-align:center}
.lede.hero .eyebrow{font-size:14px;color:var(--ink-2);margin:0 0 6px}
@media(max-width:600px){.lede.hero h2{font-size:28px}.lede h2{font-size:24px}}
.lede h2{font-size:29px;color:var(--brand);line-height:1.3}
.lede::after{content:"";display:block;height:12px;margin-top:18px;
  background:
    linear-gradient(var(--rail),var(--rail)) left center/1.5px 12px no-repeat,
    linear-gradient(var(--rail),var(--rail)) right center/1.5px 12px no-repeat,
    radial-gradient(circle, var(--rail) 2.6px, rgba(0,0,0,0) 3px) center/14px 14px no-repeat,
    linear-gradient(var(--rail),var(--rail)) center/100% 1.5px no-repeat;
  opacity:.6}
.lede p{margin:10px 0 0;color:var(--ink-2);font-size:14px;max-width:66ch;line-height:1.75}
h3{font-size:19px}

/* ---------- 카드 ---------- */
.q{background:var(--card);border:0;border-radius:18px;margin:0 0 18px;box-shadow:var(--shadow);padding-top:6px}
.q > header{display:flex;gap:11px;align-items:flex-start;padding:10px 18px 4px;background:none;border:0}
.q .tag{font-weight:700;font-size:12.5px;color:#fff;background:var(--brand);border:0;border-radius:999px;
  padding:3px 14px;white-space:nowrap;margin-top:3px}
:root[data-theme="dark"] .q .tag{color:#141B28}
#view[data-step="s5"] .q .tag,#view[data-step="s6"] .q .tag{background:var(--teal)}
#view[data-step="s5"] .chtape,#view[data-step="s6"] .chtape{color:var(--teal);background:var(--teal-bg)}
#view[data-step="s5"] .lede h2,#view[data-step="s6"] .lede h2{color:var(--teal)}
.q .qt{font-size:15.5px;font-weight:700;flex:1;min-width:0;line-height:1.55}
.q .body{padding:8px 18px 18px}
.q .body > :first-child{margin-top:0}
.hint{position:relative;font-size:13px;color:var(--ink-2);background:var(--card-2);border:0;border-radius:14px;
  padding:20px 16px 14px;margin:24px 0 0}
.hint::before{content:"TIP";position:absolute;top:-12px;left:14px;background:var(--card);
  border:1.5px solid var(--brand);color:var(--brand);font-weight:700;font-size:11px;letter-spacing:.06em;
  padding:2px 11px;border-radius:7px 7px 7px 0}
.hint b{color:var(--ink)}
.note{font-size:13px;color:var(--ink-2);margin:10px 0 0}
kbd{font-family:"IBM Plex Mono",monospace;font-size:11.5px;border:0;border-radius:4px;padding:2px 7px;background:var(--brand-bg);color:var(--brand);font-weight:600}
.path{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--ink);background:var(--card-2);
  border:0;border-left:4px solid var(--brand);padding:9px 12px;border-radius:0 4px 4px 0;display:block;max-width:100%;overflow-x:auto}

/* ---------- 표 ---------- */
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.data{border-collapse:collapse;width:100%;font-size:13px;min-width:460px}
table.data th,table.data td{border:1px solid var(--rule);padding:7px 9px;text-align:center}
table.data th{background:var(--brand-bg);font-weight:700;color:var(--ink);font-size:12.5px;border-color:var(--rule)}
table.data td.l{text-align:left}
table.data td.r{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.inv{border:2px solid var(--ink);padding:0;font-size:11.5px;min-width:620px;background:var(--card)}
.inv table{border-collapse:collapse;width:100%}
.inv td,.inv th{border:1px solid var(--rule);padding:4px 6px}
.inv .ttl{font-family:"Jua",sans-serif;font-size:19px;letter-spacing:.18em;text-align:center;border:0}
.inv .lab{background:var(--card-2);color:var(--ink-2);text-align:center;font-weight:500;white-space:nowrap}
.inv .side{background:var(--brand-bg);writing-mode:vertical-rl;text-align:center;width:22px;letter-spacing:.35em;font-weight:700}
.inv .r{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.inv .c{text-align:center}
.pay{font-size:11.5px}
.pay .lab{background:var(--card-2);text-align:center}
.slip{border:2px solid var(--ink);background:var(--card);padding:14px;min-width:460px}
.slip h4{font-family:"Jua",sans-serif;font-weight:400;text-align:center;margin:2px 0 0;font-size:18px}
.slip .to{text-align:center;font-size:13px;margin:2px 0 10px;color:var(--ink-2)}
.slip table{border-collapse:collapse;width:100%;font-size:12.5px}
.slip td,.slip th{border:1px solid var(--rule);padding:5px 8px}
.slip th{background:var(--card-2);font-weight:700}
.slip td.r{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
.slip tr.sum td,.slip tr.sum th{background:var(--card-2);font-weight:700}

/* ---------- 전표 ---------- */
.jrn{border:0;border-radius:4px;overflow:hidden;background:var(--card-2)}
.jrn .jhead{display:grid;grid-template-columns:1fr 1fr;font-size:13px;font-weight:700}
.jrn .jhead div{padding:8px 12px;text-align:center}
.jrn .jhead .d{background:var(--debit);color:#fff}
.jrn .jhead .c{background:var(--credit);color:#fff}
.jgrid{display:grid;grid-template-columns:1fr 1fr}
.jside{padding:12px}
.jside.d{border-right:2px dashed var(--rule)}
@media(max-width:700px){
  .jrn .jhead{grid-template-columns:1fr}
  .jrn .jhead .c{display:none}
  .jgrid{grid-template-columns:1fr}
  .jside.d{border-right:0;border-bottom:2px dashed var(--rule)}
  .jside.c::before{content:"대변";display:block;font-size:12.5px;font-weight:700;color:var(--credit);margin-bottom:7px}
}
.row{display:grid;grid-template-columns:1fr 110px 130px;gap:6px;margin-bottom:6px;align-items:center}
@media(max-width:1200px){.row{grid-template-columns:1fr 96px 118px}}
@media(max-width:900px){.row{grid-template-columns:1fr 1fr;grid-template-areas:"a a" "p m";gap:6px;margin-bottom:10px}
 .row select.acc{grid-area:a}.row select.ptn{grid-area:p}.row input.amt{grid-area:m}}
select,input[type="text"],input[type="number"],textarea{
  width:100%;background:var(--card);color:var(--ink);border:1.5px solid var(--rule);
  border-radius:4px;padding:7px 9px;font-size:13.5px;font-family:inherit}
input.amt{text-align:right;font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
select:hover,input:hover,textarea:hover{border-color:var(--brand-soft)}
select:focus,input:focus,textarea:focus{border-color:var(--brand);outline:none}
.row.ok select,.row.ok input{background:var(--ok-bg);border-color:var(--ok)}
.row.bad select,.row.bad input{background:var(--no-bg);border-color:var(--no)}
.sumline{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--ink-2);
  border-top:1px solid var(--rule);margin-top:9px;padding-top:6px}
.sumline b{font-family:"IBM Plex Mono",monospace;font-weight:600;color:var(--ink)}
.sumline.dbl{border-top:3px double var(--ink-3)}
.addrow{background:none;border:1.5px dashed var(--rule);color:var(--ink-3);border-radius:4px;padding:4px 9px;font-size:12.5px;width:100%}
.addrow:hover{color:var(--brand);border-color:var(--brand-soft)}

/* ---------- 동작 ---------- */
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px;align-items:center}
.btn{background:var(--brand);color:#fff;border:0;border-radius:999px;padding:9px 22px;font-weight:700;font-size:13.5px;box-shadow:var(--shadow)}
:root[data-theme="dark"] .btn{color:#10202E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn{color:#10202E}}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .btn{color:#fff}}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:var(--card);color:var(--ink-2);font-weight:500}
.btn.ghost:hover{color:var(--brand)}
.verdict{font-size:13px;font-weight:700;padding:5px 13px;border-radius:999px}
.verdict.ok{color:#fff;background:var(--ok)}
.verdict.bad{color:#fff;background:var(--no)}
:root[data-theme="dark"] .verdict.ok,:root[data-theme="dark"] .verdict.bad{color:#12181F}
.sol{margin-top:15px;border:0;border-radius:16px;background:var(--brand-bg);padding:16px 18px;font-size:13.5px}
.sol[hidden]{display:none}
.sol h4{font-family:"Jua",sans-serif;font-weight:400;font-size:16px;color:var(--brand);margin:0 0 9px}
.sol .je{display:grid;grid-template-columns:1fr 1fr;gap:0;border:0;border-radius:4px;margin:11px 0;background:var(--card);overflow:hidden}
.sol .je > div{padding:10px 13px;font-size:13px}
.sol .je .d{border-right:2px dashed var(--rule)}
.sol .je .lbl{font-size:11.5px;font-weight:700;letter-spacing:.06em;margin-bottom:5px}
.sol .je .d .lbl{color:var(--debit)}
.sol .je .c .lbl{color:var(--credit)}
.sol .je p{margin:0;display:flex;justify-content:space-between;gap:12px}
.sol .je p span:last-child{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums}
@media(max-width:560px){.sol .je{grid-template-columns:1fr}.sol .je .d{border-right:0;border-bottom:2px dashed var(--rule)}}
.opts{display:grid;gap:7px;margin:0}
.opt{display:flex;gap:11px;align-items:flex-start;border:1.5px solid transparent;border-radius:14px;
  padding:12px 16px;font-size:13.5px;cursor:pointer;background:var(--card-2)}
.opt:hover{border-color:var(--brand-soft)}
.opt input{width:auto;margin:5px 0 0;accent-color:var(--brand)}
.opt.ok{border-color:var(--ok);background:var(--ok-bg)}
.opt.bad{border-color:var(--no);background:var(--no-bg)}

function accSelect(cls){
  let o = `<option value="">계정과목</option>`;
  for(const g in ACCOUNTS){ o += `<optgroup label="${g}">` + ACCOUNTS[g].map(a=>`<option>${a}</option>`).join("") + `</optgroup>`; }
  return `<select class="${cls}">${o}</select>`;
}
function ptnSelect(cls){
  return `<select class="${cls}"><option value="">거래처</option>${PARTNERS.map(p=>`<option>${p}</option>`).join("")}</select>`;
}

  const row = () => `<div class="row">${accSelect("acc")}${ptnSelect("ptn")}<input type="text" class="amt" inputmode="numeric" placeholder="금액"></div>`;

    </div></div>`;
}

  <div class="c"><div class="lbl">대변</div>${credit.map(line).join("")}</div></div>`;
}

    const k = side.classList.contains("d") ? "d":"c";
    side.querySelectorAll(".row").forEach(r=>{
      const a=r.querySelector(".acc").value, p=r.querySelector(".ptn").value, m=num(r.querySelector(".amt").value);
      if(a || !isNaN(m)) out[k].push({a,p,m:isNaN(m)?null:m, el:r});
    });
  });
  return out;
}
function gradeSide(user, ans){
  const left = ans.map(a=>Object.assign({},a,{used:false}));
  let allOk = true;
  user.forEach(u=>{
    const hit = left.find(a=>!a.used && a.a===u.a && a.m===u.m && (a.p ? a.p===u.p : true));
    if(hit){ hit.used=true; u.el.classList.add("ok"); u.el.classList.remove("bad"); }
    else { u.el.classList.add("bad"); u.el.classList.remove("ok"); allOk=false; }
  });
  if(left.some(a=>!a.used)) allOk=false;
  return allOk;
}

const view = document.getElementById("view");
function render(){
  const s = state.step;
  view.innerHTML = s==="s0"?viewIntro(): s==="s1"?viewBase(): s==="s2"?viewTx(): s==="s3"?viewClose(): s==="s4"?viewQuery(): s==="s5"?viewFS(): s==="s6"?viewIT(): s==="s7"?viewAudit(): viewDart();
  restore();
  if(s==="s5") initFS();
  if(s==="s6") initIT();
  if(s==="s7"||s==="s8") initForms();
  view.dataset.step = s;
  const lede=view.querySelector(".lede");
  if(lede){ const i=STEPS.findIndex(x=>x.id===s); const t=document.createElement("span");
    t.className="chtape"; t.textContent = i<=0 ? "Intro" : "Chapter "+i; lede.insertBefore(t, lede.firstChild); }
  document.querySelectorAll("nav.steps button").forEach(b=>b.setAttribute("aria-current", b.dataset.step===s ? "true":"false"));
  refreshScore();
  window.scrollTo({top:0,behavior:"auto"});
  save();
}
function buildNav(){
  document.getElementById("nav").innerHTML = STEPS.map(s=>{
    const prefix = s.id==="s1"?"b": s.id==="s2"?"t": s.id==="s3"?"c": s.id==="s4"?"q":"";
    return `<li><button type="button" data-step="${s.id}"><span class="k">${s.k}</span><span>${s.label}</span>${prefix?`<span class="tick" data-prefix="${prefix}"></span>`:""}</button></li>`;
  }).join("");
  document.getElementById("nav").addEventListener("click", e=>{
    const b=e.target.closest("button[data-step]"); if(!b) return;
    state.step=b.dataset.step; render(); view.focus();
  });
}

/* 저장된 입력 복원 */
function restore(){
  view.querySelectorAll("[data-mc]").forEach(box=>{
    const v = state.inputs[box.dataset.mc];
    if(v!=null){ const r=box.querySelector(`input[value="${v}"]`); if(r) r.checked=true; }
  });
  view.querySelectorAll(".fld").forEach(inp=>{
    const v = state.inputs[inp.dataset.fk]; if(v!=null) inp.value=won(v);
  });
  view.querySelectorAll("[data-jrn]").forEach(box=>{
    const saved = state.inputs[box.dataset.jrn]; if(!saved) return;
    ["d","c"].forEach(k=>{
      const side = box.querySelector(".jside."+k);
      (saved[k]||[]).forEach((r,i)=>{
        let rows = side.querySelectorAll(".row");
        while(rows.length<=i){ addRow(side); rows = side.querySelectorAll(".row"); }
        rows[i].querySelector(".acc").value=r.a||"";
        rows[i].querySelector(".ptn").value=r.p||"";
        rows[i].querySelector(".amt").value=r.m==null?"":won(r.m);
      });
    });
    updateTotals(box);
  });
  view.querySelectorAll("[data-essay]").forEach(t=>{ const v=state.essay[t.dataset.essay]; if(v) t.value=v; });
  view.querySelectorAll("[data-acts]").forEach(a=>{
    const k = a.dataset.acts;
    const subs = Object.keys(state.res).filter(x=>x===k||x.indexOf(k+"_")===0);
    if(!subs.length) return;
    const r = subs.every(x=>state.res[x]==="ok") ? "ok" : "no";
    const v=a.querySelector(".verdict"); v.hidden=false;
    v.className="verdict "+(r==="ok"?"ok":"bad"); v.textContent=r==="ok"?"정답":"다시 확인";
  });
}
function addRow(side){
  const rows = side.querySelector(".rows");
  const d = document.createElement("div"); d.className="row";
  d.innerHTML = accSelect("acc")+ptnSelect("ptn")+`<input type="text" class="amt" inputmode="numeric" placeholder="금액">`;
  rows.appendChild(d); return d;
}
function updateTotals(box){
  ["d","c"].forEach(k=>{
    const side=box.querySelector(".jside."+k);
    let t=0; side.querySelectorAll(".amt").forEach(i=>{const n=num(i.value); if(!isNaN(n)) t+=n;});
    side.querySelector(".tot").textContent = won(t);
  });
}
function storeJrn(box){
  const out={d:[],c:[]};
  box.querySelectorAll(".jside").forEach(side=>{
    const k=side.classList.contains("d")?"d":"c";
    side.querySelectorAll(".row").forEach(r=>{
      out[k].push({a:r.querySelector(".acc").value,p:r.querySelector(".ptn").value,m:isNaN(num(r.querySelector(".amt").value))?null:num(r.querySelector(".amt").value)});
    });
  });
  state.inputs[box.dataset.jrn]=out; save();
}

  if(chk){ check(chk.closest("[data-acts]").dataset.acts, chk.closest(".q")); return; }

view.addEventListener("input", e=>{
  const t=e.target;
  if(t.classList.contains("amt") && t.closest("[data-jrn]")){ updateTotals(t.closest("[data-jrn]")); }
  if(t.classList.contains("fld")){ state.inputs[t.dataset.fk]=isNaN(num(t.value))?null:num(t.value); save(); }
  if(t.dataset.essay!=null){ state.essay[t.dataset.essay]=t.value; save(); }
  if(t.classList.contains("fs-in")){ state.fs[t.dataset.fs]=isNaN(num(t.value))?null:num(t.value); computeFS(); save(); }
});
view.addEventListener("change", e=>{
  const t=e.target;
  if(t.type==="radio"){ const box=t.closest("[data-mc]"); state.inputs[box.dataset.mc]=Number(t.value); save(); }
  if(t.closest("[data-jrn]")) storeJrn(t.closest("[data-jrn]"));
});
/* 금액 칸에서 + 키 = 0 세 개 (sPLUS와 동일) */
view.addEventListener("keydown", e=>{
  const t=e.target;
  if(!t || t.tagName!=="INPUT" || !t.classList || !t.classList.contains("amt")) return;
  if(e.key!=="+" && e.key!=="Add") return;
  e.preventDefault();
  const n=num(t.value);
  if(isNaN(n)) return;
  t.value = won(n*1000);
  t.dispatchEvent(new Event("input",{bubbles:true}));
  t.dispatchEvent(new Event("change",{bubbles:true}));
});
view.addEventListener("blur", e=>{
  const t=e.target;
  if(t.classList && t.classList.contains("amt")){ const n=num(t.value); t.value = isNaN(n)?"":won(n);
    if(t.closest("[data-jrn]")) storeJrn(t.closest("[data-jrn]")); }
  if(t.classList && t.classList.contains("fs-in")){ const n=num(t.value); t.value=isNaN(n)?"":won(n); }
}, true);

/* 채점 */
function markMC(box, ansIdx){
  let ok=false;
  box.querySelectorAll(".opt").forEach((l,i)=>{
    l.classList.remove("ok","bad");
    const r=l.querySelector("input");
    if(r.checked){ if(i===ansIdx){l.classList.add("ok");ok=true;} else l.classList.add("bad"); }
  });
  return ok;
}
function verdict(card, key, ok, msg){
  const acts=card.querySelector("[data-acts]"); const v=acts.querySelector(".verdict");
  v.hidden=false; v.className="verdict "+(ok?"ok":"bad"); v.textContent = msg || (ok?"정답":"다시 확인");
  state.res[key]= ok?"ok":"no"; save(); refreshScore();
  if(!ok){ const sol=card.querySelector(".sol"); if(sol && sol.hidden){ /* 오답이어도 바로 공개하지 않음 */ } }
}
function check(key, card){
  const b = BASE.find(x=>x.id===key);
  if(b){ verdict(card, key, markMC(card.querySelector("[data-mc]"), b.opts.indexOf(b.menu))); return; }
  const t = TX.find(x=>x.id===key);
  if(t){
    const okSlip = markMC(card.querySelector(`[data-mc="${t.id}_s"]`), t.slipAns);
    const box = card.querySelector(`[data-jrn="${t.id}_j"]`);
    const u = readJrn(box);
    const okJ = gradeSide(u.d, t.debit) && gradeSide(u.c, t.credit);
    state.res[key+"_s"]= okSlip?"ok":"no"; state.res[key+"_j"]= okJ?"ok":"no";
    const v=card.querySelector(".verdict"); v.hidden=false;
    const both = okSlip&&okJ;
    v.className="verdict "+(both?"ok":"bad");
    v.textContent = both? "정답" : (okJ? "분개는 맞고 전표 선택이 틀렸어요" : okSlip? "전표는 맞고 분개를 다시 보세요" : "다시 확인");
    save(); refreshScore(); return;
  }
  const c = CLOSE.find(x=>x.id===key);
  if(c){
    let ok = true;
    if(c.kind==="mc"||c.kind==="amtmc") ok = markMC(card.querySelector(`[data-mc="${c.id}_m"]`), c.ans) && ok;
    if(c.fields) c.fields.forEach(f=>{
      const inp = card.querySelector(`[data-fk="${c.id}_${f.k}"]`);
      const good = num(inp.value)===f.ans;
      inp.style.borderColor = good? "var(--ok)":"var(--no)";
      inp.style.background = good? "var(--ok-bg)":"var(--no-bg)";
      ok = good && ok;
    });
    if(c.kind==="jrn"){ const box=card.querySelector(`[data-jrn="${c.id}_j"]`); const u=readJrn(box);
      ok = gradeSide(u.d,c.debit) && gradeSide(u.c,c.credit) && ok; }
    verdict(card, key, ok); return;
  }
  const q = QUERY.find(x=>x.id===key);
  if(q){
    const okM = markMC(card.querySelector(`[data-mc="${q.id}_m"]`), q.ans);
    const inp = card.querySelector(`[data-fk="${q.id}_v"]`);
    const okV = num(inp.value)===q.val;
    inp.style.borderColor = okV? "var(--ok)":"var(--no)";
    inp.style.background = okV? "var(--ok-bg)":"var(--no-bg)";
    state.res[key+"_m"]=okM?"ok":"no"; state.res[key+"_v"]=okV?"ok":"no";
    const v=card.querySelector(".verdict"); v.hidden=false;
    v.className="verdict "+((okM&&okV)?"ok":"bad");
    v.textContent = (okM&&okV)?"정답":(okV?"금액은 맞아요. 조회 메뉴를 다시 보세요":okM?"메뉴는 맞아요. 금액을 다시 확인하세요":"다시 확인");
    save(); refreshScore(); return;
  }
}

/* 심화 계산 */
function initFS(){
  view.querySelectorAll(".fs-in").forEach(i=>{ const v=state.fs[i.dataset.fs]; if(v!=null) i.value=won(v); });
  document.getElementById("fsSample").onclick = ()=>{
    FS_FIELDS.forEach(f=>{ state.fs[f.k]=f.v; const el=view.querySelector(`[data-fs="${f.k}"]`); if(el) el.value=won(f.v); });
    computeFS(); save();
  };
  document.getElementById("fsClear").onclick = ()=>{
    FS_FIELDS.forEach(f=>{ state.fs[f.k]=null; const el=view.querySelector(`[data-fs="${f.k}"]`); if(el) el.value=""; });
    computeFS(); save();
  };
  document.getElementById("printBtn").onclick = ()=>window.print();
  computeFS();
}
function computeFS(){
  const d={}; let any=false;
  FS_FIELDS.forEach(f=>{ const v=state.fs[f.k]; d[f.k]= (v==null||isNaN(v))?0:v; if(v) any=true; });
  const ta=d.ca+d.nca, tl=d.cl+d.ncl, le=tl+d.eq;
  const set=(id,v)=>{const el=document.getElementById(id); if(el) el.textContent = any? won(v):"–";};
  set("o_ta",ta); set("o_tl",tl); set("o_le",le);
  set("o_gp", d.rev-d.cogs); set("o_op", d.rev-d.cogs-d.sga);
  const msg=document.getElementById("balMsg");
  if(msg){
    if(!any) msg.innerHTML="";
    else if(ta===le) msg.innerHTML=`<div class="okbox">자산총계와 부채·자본 합계가 일치합니다. 대차평균의 원리가 지켜졌어요.</div>`;
    else msg.innerHTML=`<div class="warnbox">자산총계와 부채·자본 합계가 ${won(Math.abs(ta-le))}원 어긋납니다. 옮겨 적은 금액을 다시 확인해 보세요.</div>`;
  }
  const box=document.getElementById("ratioBox"); if(!box) return;
  box.innerHTML = ratioCards(d, any);
  renderDupont(d, any);
  renderCCC(d, any);
}
function ratioCards(d, any){
  return RATIOS.map(r=>{
    const v = any? r.calc(d) : NaN;
    const show = isFinite(v)? v.toFixed(r.u==="회"?1:1) : "–";
    const [txt,cls] = isFinite(v)? r.band(v) : ["입력 대기","ink-3"];
    const pct = isFinite(v)? Math.max(2, Math.min(100, v/r.max*100)) : 0;
    const refPct = Math.max(0, Math.min(100, r.ref/r.max*100));
    const color = cls==="ok"?"var(--ok)":cls==="warn"?"var(--warn)":cls==="no"?"var(--no)":"var(--rule)";
    return `<div class="rc" style="--c:${isFinite(v)?color:'var(--ink-3)'}" tabindex="0"><div class="rn">${r.n}</div>
      <div class="rv" style="color:${isFinite(v)?color:'var(--ink-3)'}">${show}<span style="font-size:13px;font-weight:400"> ${isFinite(v)?r.u:""}</span></div>
      <div class="rf">${r.f}</div>
      <svg viewBox="0 0 100 9" preserveAspectRatio="none" role="img" aria-label="${r.n} ${show}${r.u}">
        <rect x="0" y="3" width="100" height="3" fill="var(--rule-2)"></rect>
        <rect x="0" y="2" width="${pct}" height="5" fill="${color}"></rect>
        <rect x="${refPct-0.4}" y="0" width="0.8" height="9" fill="var(--ink-3)"></rect>
      </svg>
      <div class="rj"><b style="color:${isFinite(v)?color:'var(--ink-3)'}">${txt}</b> · ${r.say}</div>
      <div class="refnote">막대 안 세로선은 참고 기준 <b>${r.ref}${r.u}</b>입니다. ${r.lower?"낮을수록":"높을수록"} 좋게 보지만, 업종과 규모에 따라 적정선은 달라집니다.</div></div>`;
  }).join("");
}

/* 듀폰 분해 : ROE = 순이익률 × 총자산회전율 × 재무레버리지 */
function renderDupont(d, any){
  const box=document.getElementById("dupontBox"), msg=document.getElementById("dupontMsg");
  if(!box) return;
  const ta=d.ca+d.nca;
  const pm = d.rev? d.ni/d.rev*100 : NaN;
  const at = ta? d.rev/ta : NaN;
  const lv = d.eq? ta/d.eq : NaN;
  const roe = (isFinite(pm)&&isFinite(at)&&isFinite(lv))? pm*at*lv : NaN;
  const cell=(l,v,u,f,cls)=>`<div class="dp ${cls||""}"><div class="l">${l}</div>
    <div class="v">${any&&isFinite(v)?v.toFixed(2):"–"}<span style="font-size:12px;font-weight:400"> ${u}</span></div>
    <div class="f">${f}</div></div>`;
  box.innerHTML =
    cell("매출액순이익률", pm, "%", "당기순이익 ÷ 매출액") + `<div class="op">×</div>` +
    cell("총자산회전율", at, "회", "매출액 ÷ 자산총계") + `<div class="op">×</div>` +
    cell("재무레버리지", lv, "배", "자산총계 ÷ 자본총계") + `<div class="op">=</div>` +
    cell("자기자본순이익률", roe, "%", "ROE", "res");
  if(!msg) return;
  if(!any || !isFinite(roe)){ msg.textContent=""; return; }
  const score = [
    {n:"수익성(순이익률)", v:pm, ref:5, tip:"판매가와 원가·판관비 구조를 손봐야 합니다"},
    {n:"활동성(총자산회전율)", v:at, ref:1.5, tip:"놀고 있는 자산은 없는지, 재고와 매출채권이 묶여 있지 않은지 봐야 합니다"},
    {n:"레버리지", v:lv, ref:2, tip:"빚에 기대는 정도"}
  ];
  const weak = score[0].v/score[0].ref <= score[1].v/score[1].ref ? score[0] : score[1];
  const lvNote = lv>=2.5 ? " 다만 재무레버리지가 2.5배를 넘어, ROE가 높아 보이는 이유의 상당 부분이 빚이라는 점도 함께 봐야 합니다." : "";
  msg.innerHTML = `세 힘 중 상대적으로 약한 쪽은 <b>${weak.n}</b>입니다. ${weak.tip}.${lvNote}`;
}

/* 현금전환주기 */
function renderCCC(d, any){
  const box=document.getElementById("cccBox"); if(!box) return;
  const di = d.cogs? d.inv/d.cogs*365 : NaN;
  const dr = d.rev? d.ar/d.rev*365 : NaN;
  const dp = d.cogs? d.ap/d.cogs*365 : NaN;
  if(!any || !isFinite(di)||!isFinite(dr)||!isFinite(dp)){
    box.innerHTML = `<p class="note" style="margin:0">재고자산·매출채권·매입채무·매출원가 금액을 입력하면 계산됩니다.</p>`; return;
  }
  const ccc = di+dr-dp;
  const span = Math.max(di+dr, dp) || 1;
  const X = v => 4 + v/span*92;
  const need = d.rev/365*ccc;
  box.innerHTML = `
  <svg viewBox="0 0 100 44" preserveAspectRatio="none" role="img" aria-label="현금전환주기 ${ccc.toFixed(0)}일">
    <rect x="${X(0)}" y="4" width="${X(di)-X(0)}" height="7" fill="var(--warn)" opacity=".85"></rect>
    <rect x="${X(di)}" y="4" width="${X(di+dr)-X(di)}" height="7" fill="var(--debit)" opacity=".85"></rect>
    <rect x="${X(0)}" y="16" width="${X(dp)-X(0)}" height="7" fill="var(--credit)" opacity=".75"></rect>
    <rect x="${X(dp)}" y="28" width="${Math.max(0.6,X(di+dr)-X(dp))}" height="7" fill="var(--ok)"></rect>
    <line x1="${X(dp)}" y1="16" x2="${X(dp)}" y2="35" stroke="var(--ink-3)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="3 3"></line>
    <line x1="${X(di+dr)}" y1="4" x2="${X(di+dr)}" y2="35" stroke="var(--ink-3)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="3 3"></line>
  </svg>
  <div class="sumline" style="border:0;margin-top:2px;font-size:11.5px">
    <span style="color:var(--warn)">■ 재고 보유</span><span style="color:var(--debit)">■ 대금 회수 대기</span>
    <span style="color:var(--credit)">■ 매입대금 지급 유예</span><span style="color:var(--ok)">■ 현금이 묶이는 기간</span></div>
  <table class="data" style="margin-top:10px;min-width:0">
    <tr><th style="text-align:left">구간</th><th>일수</th><th style="text-align:left">뜻</th></tr>
    <tr><td class="l">재고 보유기간</td><td class="r">${di.toFixed(0)}일</td><td class="l">상품을 사서 팔 때까지</td></tr>
    <tr><td class="l">매출채권 회수기간</td><td class="r">${dr.toFixed(0)}일</td><td class="l">팔고 나서 돈을 받을 때까지</td></tr>
    <tr><td class="l">매입채무 지급기간</td><td class="r">${dp.toFixed(0)}일</td><td class="l">사고 나서 돈을 낼 때까지(버는 시간)</td></tr>
    <tr><td class="l"><b>현금전환주기(CCC)</b></td><td class="r"><b>${ccc.toFixed(0)}일</b></td><td class="l">${di.toFixed(0)} + ${dr.toFixed(0)} − ${dp.toFixed(0)}</td></tr>
  </table>
  <div class="${ccc>0?"warnbox":"okbox"}">${ccc>0
    ? `매입대금을 먼저 내고 <b>${ccc.toFixed(0)}일</b> 뒤에야 판매대금이 들어옵니다. 그동안 버티려면 대략 <b>${won(Math.round(need))}원</b>(매출액 ÷ 365 × CCC)의 운전자금이 필요합니다. 이익이 나도 이 돈이 없으면 흑자도산이 일어납니다.`
    : `판매대금을 먼저 받고 매입대금을 나중에 냅니다. 사실상 거래처 돈으로 장사하는 구조여서 자금 부담이 거의 없습니다.`}</div>`;
}

function initIT(){
  state.it = state.it || {};
  state.it.bep = state.it.bep || Object.assign({q:1500}, BEP_PRESETS.dist);
  state.it.trend = state.it.trend || {rev:1050000000, cogs:780000000, sga:205000000, ni:38000000};
  state.it.match = state.it.match || {};

  view.querySelectorAll("[data-firm]").forEach(sel=>{
    const v = state.it.match[sel.dataset.firm]; if(v!=null) sel.value=v;
    sel.addEventListener("change",()=>{ state.it.match[sel.dataset.firm]= sel.value===""?null:Number(sel.value); save(); });
  });
  document.getElementById("matchCheck").onclick = ()=>{
    let ok=true, done=true;
    IT_FIRMS.forEach(f=>{
      const card=document.getElementById("fc_"+f.id);
      const pick=state.it.match[f.id];
      card.classList.remove("ok","bad");
      if(pick==null){ done=false; return; }
      if(pick===f.ans) card.classList.add("ok"); else { card.classList.add("bad"); ok=false; }
    });
    const v=document.getElementById("matchV"); v.hidden=false;
    v.className="verdict "+(done&&ok?"ok":"bad");
    v.textContent = !done? "세 회사를 모두 골라 주세요" : ok? "세 회사 모두 정답" : "다시 확인";
  };
  document.getElementById("matchSol").onclick = ()=>{
    const cards=view.querySelectorAll("#card_match .sol");
    const hide = !cards[0].hidden;
    cards.forEach(c=>c.hidden=hide);
    document.getElementById("matchSol").textContent = hide? "해설 보기":"해설 접기";
  };

  view.querySelectorAll("[data-bep]").forEach(b=>b.addEventListener("click",()=>{
    const pre=BEP_PRESETS[b.dataset.bep];
    state.it.bep = Object.assign({}, pre, {q: state.it.bep.q});
    fillBep(); computeBep(); save();
  }));
  view.querySelectorAll(".bep-in").forEach(i=>i.addEventListener("input",()=>{
    const n=num(i.value); state.it.bep[i.dataset.bepK]=isNaN(n)?0:n; computeBep(); save();
  }));
  const q=document.getElementById("bepQ");
  q.addEventListener("input",()=>{ state.it.bep.q=Number(q.value); computeBep(); save(); });
  fillBep(); computeBep();

  view.querySelectorAll(".tr-in").forEach(i=>{
    const v=state.it.trend[i.dataset.tr]; if(v!=null) i.value=won(v);
    i.addEventListener("input",()=>{ const n=num(i.value); state.it.trend[i.dataset.tr]=isNaN(n)?0:n; computeTrend(); save(); });
  });
  computeTrend();
}
function fillBep(){
  const b=state.it.bep;
  view.querySelectorAll(".bep-in").forEach(i=>i.value=won(b[i.dataset.bepK]));
  const n=document.getElementById("bepNote"); const key=Object.keys(BEP_PRESETS).find(k=>BEP_PRESETS[k].fc===b.fc&&BEP_PRESETS[k].vc===b.vc);
  n.textContent = key? BEP_PRESETS[key].note : "";
}
function computeBep(){
  const b=state.it.bep, cm=b.p-b.vc;
  const bepQ = cm>0? b.fc/cm : NaN;
  const q = b.q, rev=b.p*q, cost=b.fc+b.vc*q, op=rev-cost;
  const dol = op!==0? (cm*q)/op : NaN;
  const ms = q>0? (q-bepQ)/q*100 : NaN;
  document.getElementById("bepQL").textContent = won(q);
  const slider = document.getElementById("bepQ");
  const qMax = Math.max(1000, isFinite(bepQ)? Math.ceil(bepQ*2.2/100)*100 : 1000, q);
  slider.max = qMax; slider.value = q;
  const yMax = Math.max(b.p*qMax, b.fc+b.vc*qMax) || 1;
  const X = v => 6 + v/qMax*92, Y = v => 92 - v/yMax*84;
  const bx = isFinite(bepQ)&&bepQ<=qMax ? X(bepQ) : null;
  document.getElementById("bepChart").innerHTML = `
  <svg viewBox="0 0 100 100" preserveAspectRatio="none" role="img" aria-label="손익분기점 그래프">
    <line x1="6" y1="92" x2="98" y2="92" stroke="var(--rule)" stroke-width="1" vector-effect="non-scaling-stroke"></line>
    <line x1="6" y1="8" x2="6" y2="92" stroke="var(--rule)" stroke-width="1" vector-effect="non-scaling-stroke"></line>
    <line x1="${X(0)}" y1="${Y(b.fc)}" x2="${X(qMax)}" y2="${Y(b.fc)}" stroke="var(--ink-3)" stroke-width="1" vector-effect="non-scaling-stroke" stroke-dasharray="4 4"></line>
    <line x1="${X(0)}" y1="${Y(b.fc)}" x2="${X(qMax)}" y2="${Y(b.fc+b.vc*qMax)}" stroke="var(--credit)" stroke-width="2" vector-effect="non-scaling-stroke"></line>
    <line x1="${X(0)}" y1="${Y(0)}" x2="${X(qMax)}" y2="${Y(b.p*qMax)}" stroke="var(--debit)" stroke-width="2" vector-effect="non-scaling-stroke"></line>
    ${bx!=null?`<line x1="${bx}" y1="8" x2="${bx}" y2="92" stroke="var(--ok)" stroke-width="1.5" vector-effect="non-scaling-stroke"></line>
       <rect x="${bx-0.9}" y="${Y(b.p*bepQ)-1.8}" width="1.8" height="3.6" fill="var(--ok)"></rect>`:""}
    <line x1="${X(q)}" y1="8" x2="${X(q)}" y2="92" stroke="var(--brand)" stroke-width="1.5" vector-effect="non-scaling-stroke" stroke-dasharray="5 4"></line>
  </svg>
  <div class="sumline" style="border:0;margin-top:4px"><span style="color:var(--debit)">매출액</span><span style="color:var(--credit)">총비용</span><span style="color:var(--ok)">손익분기점</span><span style="color:var(--brand)">현재 판매량</span></div>`;
  const k=(l,v)=>`<div><div class="l">${l}</div><div class="v">${v}</div></div>`;
  document.getElementById("bepKpi").innerHTML =
    k("공헌이익(단위당)", cm>0? won(cm)+"원":"–") +
    k("손익분기점 수량", isFinite(bepQ)? won(Math.ceil(bepQ))+"개":"–") +
    k("손익분기점 매출액", isFinite(bepQ)? won(Math.ceil(bepQ*b.p))+"원":"–") +
    k("영업이익", `<span style="color:${op>=0?"var(--ok)":"var(--no)"}">${won(Math.round(op))}원</span>`) +
    k("안전한계율", isFinite(ms)? ms.toFixed(1)+"%":"–") +
    k("영업레버리지도", isFinite(dol)&&op>0? dol.toFixed(1)+"배":"–");
}
function computeTrend(){
  const cur={rev:state.fs.rev||0, cogs:state.fs.cogs||0, sga:state.fs.sga||0, ni:state.fs.ni||0};
  const pre=state.it.trend;
  const rows=[["매출액","rev"],["매출원가","cogs"],["판매비와관리비","sga"],["당기순이익","ni"]];
  const pct=(v,base)=> base? (v/base*100).toFixed(1)+"%" : "–";
  const gr=(c,p)=> p? ((c-p)/p*100) : NaN;
  document.getElementById("trendBox").innerHTML = `<table class="data">
   <tr><th>구분</th><th>전기</th><th>당기</th><th>증감액</th><th>증감률</th><th>전기 매출 대비</th><th>당기 매출 대비</th></tr>
   ${rows.map(([l,k])=>{
     const g=gr(cur[k],pre[k]);
     const col = !isFinite(g)?"var(--ink-3)": (k==="cogs"||k==="sga") ? (g>0?"var(--no)":"var(--ok)") : (g>0?"var(--ok)":"var(--no)");
     return `<tr><td class="l">${l}</td><td class="r">${won(pre[k])}</td><td class="r">${won(cur[k])}</td>
     <td class="r">${won(cur[k]-pre[k])}</td><td class="r" style="color:${col}">${isFinite(g)?(g>0?"+":"")+g.toFixed(1)+"%":"–"}</td>
     <td class="r">${pct(pre[k],pre.rev)}</td><td class="r">${pct(cur[k],cur.rev)}</td></tr>`;
   }).join("")}
  </table>
  ${cur.rev? "":`<p class="note">앞 단계(재무제표 분석)에서 당기 금액을 입력하거나 예시 데이터를 불러오면 당기 열이 채워집니다.</p>`}`;
}

function doCopy(text, btn){
  const old = btn.textContent, ok=()=>{ btn.textContent="복사했어요"; setTimeout(()=>btn.textContent=old,1400); };
  const fb=()=>{ const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
    document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); ok(); }catch(e){ btn.textContent="복사 실패"; setTimeout(()=>btn.textContent=old,1400); } document.body.removeChild(ta); };
  if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(ok).catch(fb); } else fb();
}
function field(n, k, ph, rows){
  return `<textarea data-st="${n}.${k}" rows="${rows||3}" placeholder="${ph||""}"></textarea>`;
}
function repWrap(n, k, cols, min){
  REPS[n+"."+k]={cols:cols, min:min};
  return `<div id="rep_${n}_${k}"></div>`;
}
function drawRep(n, k){
  const cfg=REPS[n+"."+k], box=document.getElementById(`rep_${n}_${k}`); if(!cfg||!box) return;
  const store=ns(n);
  if(!Array.isArray(store[k]) || !store[k].length) store[k]=Array(cfg.min).fill(0).map(()=>cfg.cols.map(()=>""));
  const rows=store[k];
  box.innerHTML = `<div class="scroll"><table class="rep"><thead><tr>${cfg.cols.map(c=>`<th style="${c.w?`width:${c.w}`:""}">${c.l}</th>`).join("")}<th style="width:34px"></th></tr></thead>
    <tbody>${rows.map((r,i)=>`<tr>${cfg.cols.map((c,j)=>`<td>${c.opts
      ? `<select data-ri="${i}" data-ci="${j}"><option value="">선택</option>${c.opts.map(o=>`<option${r[j]===o?" selected":""}>${o}</option>`).join("")}</select>`
      : `<textarea rows="2" data-ri="${i}" data-ci="${j}" placeholder="${c.p||""}">${esc(r[j]||"")}</textarea>`}</td>`).join("")}
      <td><button type="button" class="rowdel" data-ri="${i}" aria-label="행 삭제">×</button></td></tr>`).join("")}</tbody></table></div>
    <button type="button" class="addrow" data-repadd>행 추가</button>`;
  box.querySelectorAll("textarea,select").forEach(el=>el.addEventListener("input",()=>{
    rows[Number(el.dataset.ri)][Number(el.dataset.ci)] = el.value; save();
  }));
  box.querySelectorAll(".rowdel").forEach(b=>b.addEventListener("click",()=>{
    if(rows.length<=1) return; rows.splice(Number(b.dataset.ri),1); save(); drawRep(n,k);
  }));
  box.querySelector("[data-repadd]").addEventListener("click",()=>{
    rows.push(cfg.cols.map(()=>"")); save(); drawRep(n,k);
  });
}
function checklist(n, k, items){
  const store=ns(n); store[k]=store[k]||{};
  return `<div data-chk="${n}.${k}">${items.map((it,i)=>
    `<label class="check${store[k][i]?" on":""}"><input type="checkbox" data-i="${i}"${store[k][i]?" checked":""}>
      <span><span class="cat">${it.c}</span>${it.t}</span></label>`).join("")}</div>`;
}
function initForms(){
  view.querySelectorAll("[data-st]").forEach(el=>{
    const [n,k]=el.dataset.st.split("."); const v=ns(n)[k]; if(v!=null) el.value=v;
    el.addEventListener("input",()=>{ ns(n)[k]=el.value; save(); });
    el.addEventListener("change",()=>{ ns(n)[k]=el.value; save(); });
  });
  view.querySelectorAll("[data-chk]").forEach(box=>{
    const [n,k]=box.dataset.chk.split(".");
    box.querySelectorAll("input").forEach(cb=>cb.addEventListener("change",()=>{
      ns(n)[k][cb.dataset.i]=cb.checked; cb.closest(".check").classList.toggle("on",cb.checked); save();
    }));
  });
  view.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{
    const t=b.closest(".prompt").querySelector(".ptxt").textContent; doCopy(t,b);
  }));
  Object.keys(REPS).forEach(key=>{ const [n,k]=key.split("."); drawRep(n,k); });
  const caseBox=document.getElementById("caseSel");
  if(caseBox){
    caseBox.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
      ns("audit").case=b.dataset.case; save(); render();
    }));
  }
  const rep=document.getElementById("makeReport");
  if(rep) rep.addEventListener("click",()=>doCopy(buildAuditReport(),rep));
  const rep2=document.getElementById("makeDartReport");
  if(rep2) rep2.addEventListener("click",()=>doCopy(buildDartReport(),rep2));
  const dartBox=document.getElementById("dartFs");
  if(dartBox){
    dartBox.querySelectorAll(".dfs-in").forEach(i=>{
      const v=ns("dart").fs && ns("dart").fs[i.dataset.dfs]; if(v!=null) i.value=won(v);
      i.addEventListener("input",()=>{ const d=ns("dart"); d.fs=d.fs||{}; const nv=num(i.value); d.fs[i.dataset.dfs]=isNaN(nv)?null:nv; computeDart(); save(); });
    });
    computeDart();
  }
}

${rows.length? rows.map((r,i)=>`(${i+1}) 발견 : ${r[0]}\n    AI 표현 : ${r[1]}\n    올바른 처리 : ${r[2]}\n    근거 : ${r[3]}\n    영향 : ${r[4]}`).join("\n") : "(기록 없음)"}

[4] 프로그램 검증 결과
${a.verify||"(미기재)"}

[5] 감사의견
${a.opinion||"(미선택)"}
${a.reason||""}

[6] 나의 검증 기준
${a.meta||"(미기재)"}`;
}

/* ---------- 실제 기업 검증 ---------- */
const DART_ERR = ["최신 연도 수치가 없어 예전 숫자를 말함","연결재무제표와 별도재무제표를 섞음","단위 오독(백만원·천원)","업종 평균을 사실처럼 단정","존재하지 않는 공시·계정 인용","비율 계산 자체가 틀림","좋은 말만 고른 편향된 요약"];
function viewDart(){
  const d=ns("dart"); d.fs=d.fs||{};
  const row = f => `<div class="fsrow"><span>${f.label}</span><input class="amt dfs-in" data-dfs="${f.k}" type="text" inputmode="numeric"></div>`;
  return `<div class="lede"><h2>실제 기업 재무제표 검증</h2>
  <p>교과서 속 회사가 아니라 <b>진짜 회사</b>의 숫자를 다룹니다. 공시 원문에서 직접 숫자를 옮기고, 같은 회사에 대해 AI가 한 말을 문장 단위로 쪼개 사실인지 대조합니다. 회계를 배운 사람만 할 수 있는 일이에요.</p></div>

  ${qCard("1","기업 고르고 숫자 가져오기",
    `<div class="fieldline"><label for="co">검증할 기업</label>
      <input id="co" type="text" data-st="dart.co" placeholder="예: 더존비즈온 (2025년 사업보고서)" style="max-width:320px"></div>
     <div class="path" style="white-space:normal;margin-top:10px">dart.fss.or.kr → 회사명 검색 → [사업보고서] → <b>III. 재무에 관한 사항</b> → 재무제표 / 또는 [재무제표 데이터] 탭에서 엑셀로 내려받기</div>
     <div class="hint"><b>옮겨 적기 전에 확인할 세 가지</b> · ① 단위가 원인가 백만원인가 ② 연결재무제표인가 별도재무제표인가 ③ 당기인가 전기인가. 이 셋을 확인하지 않고 옮기면 뒤의 모든 계산이 무의미해집니다.</div>
     <p class="note">IT 업종 후보 : 소프트웨어(더존비즈온·티맥스), 플랫폼(네이버·카카오), 게임(크래프톤·펄어비스·넷마블), 하드웨어 유통(에스에이엠티 등). 업종이 다른 두 회사를 함께 골라 비교하면 앞 단계에서 배운 차이가 그대로 보입니다.</p>`,"d1")}

  ${qCard("2","옮겨 적은 숫자로 비율 계산",
    `<div class="grid2" id="dartFs">
       <div class="fs"><h3>재무상태표</h3><p class="sub">단위 원 · 원 단위로 환산해서 입력</p>${FS_FIELDS.filter(f=>f.g==="bs").map(row).join("")}</div>
       <div class="fs"><h3>포괄손익계산서</h3><p class="sub">단위 원</p>${FS_FIELDS.filter(f=>f.g==="is").map(row).join("")}</div>
     </div>
     <div id="dartMsg"></div>
     <div class="ratios" id="dartRatio" style="margin-top:14px"></div>
     <p class="note">재고자산이 거의 없는 회사라면 재고 관련 비율은 계산되지 않거나 의미가 없습니다. 그 자체가 업종의 특징이니 그대로 기록하세요.</p>`,"d2")}

  ${qCard("3","AI에게 두 번 물어보기",
    `<p class="note" style="margin:0 0 4px;font-weight:600;color:var(--ink)">첫 번째 — 자료를 주지 않고 물어봅니다.</p>
     ${promptCard("질문 A", `[회사명]의 최근 재무 상태를 분석해 줘. 매출액, 영업이익, 부채비율, 유동비율을 숫자로 알려주고 투자 의견도 말해 줘.`)}
     <p class="note" style="margin:14px 0 4px;font-weight:600;color:var(--ink)">두 번째 — 내가 공시에서 옮긴 숫자를 주고 물어봅니다.</p>
     ${promptCard("질문 B", `아래는 내가 전자공시(DART) 사업보고서에서 직접 옮긴 [회사명]의 재무제표 요약이야. 이 숫자만 사용해서 분석해 주고, 숫자로 확인할 수 없는 내용은 "자료로 확인 불가"라고 표시해 줘.

(여기에 위 표에 입력한 금액을 붙여넣기)`)}
     <div class="hint">두 답을 나란히 놓고 비교하세요. <b>같은 회사인데 왜 숫자가 다른가?</b> 이 질문이 오늘 수업의 핵심입니다.</div>
     ${field("dart","compare","두 답변의 차이를 적어 보세요. 특히 A의 숫자가 공시 원문과 얼마나 달랐는지.",4)}`,"d3")}

  ${qCard("4","주장 분해표 · AI의 답을 문장 단위로 판정",
    repWrap("dart","claims",[
      {l:"AI가 한 주장(문장 그대로)", p:"한 문장씩 끊어서", w:"32%"},
      {l:"판정", opts:["근거 확인됨","수치가 틀림","근거 없는 의견","자료로 확인 불가"], w:"14%"},
      {l:"내가 대조한 실제 수치와 출처", p:"예: 사업보고서 III-2 연결재무상태표, 유동부채 1,204,300백만원", w:"32%"},
      {l:"고쳐 쓴 문장", p:"사실에 맞게 다시 쓰기", w:"22%"}
    ],4) +
    `<p class="note" style="margin-top:12px">자주 나타나는 오류 유형 — 판정할 때 참고하세요.</p>
     <div>${DART_ERR.map(e=>`<span class="pill">${e}</span>`).join("")}</div>`,"d4")}

  ${qCard("5","내 결론 쓰기",
    `<p class="note" style="margin:0 0 6px">AI의 요약이 아니라, 내가 대조한 숫자에 근거한 내 문장으로 씁니다.</p>
     ${field("dart","conclusion","이 회사의 재무 상태를 세 문장으로 정리하고, 가장 주목할 비율 하나와 그 이유를 쓰세요.",4)}
     <p class="note" style="margin-top:12px;font-weight:600;color:var(--ink)">AI 사용 기록 — 어디까지 AI에게 맡겼고 어디부터 내가 했는지 솔직하게 쓰세요.</p>
     ${field("dart","usage","예: 비율 해석의 방향은 AI에게 물었고, 모든 숫자는 공시 원문에서 직접 확인했으며 세 군데를 수정했다.",3)}
     <div class="acts"><button type="button" class="btn" id="makeDartReport">검증 보고서 모아서 복사</button></div>`,"d5")}

  ${qCard("생각","한 걸음 더",
    `<ul style="margin:0;padding-left:20px;font-size:13.5px">
      <li>AI가 틀린 숫자를 말했다면, 그 숫자는 어디서 왔을까요? 아예 없는 값일까요, 다른 연도나 다른 회사의 값일까요?</li>
      <li>같은 질문을 서로 다른 AI에 물었을 때 답이 다르다면, 무엇을 기준으로 옳고 그름을 가릴 수 있을까요?</li>
      <li>회계 담당자가 AI 답변을 그대로 재무제표에 반영했다가 오류가 드러났다면, 그 책임은 누구에게 있을까요?</li>
      <li>앞으로 회계 프로그램에 AI가 들어온다면, 사람이 끝까지 쥐고 있어야 할 판단은 무엇일까요?</li>
    </ul>`,"d6")}`;
}
function computeDart(){
  const src=ns("dart").fs||{}; const d={}; let any=false;
  FS_FIELDS.forEach(f=>{ const v=src[f.k]; d[f.k]=(v==null||isNaN(v))?0:v; if(v) any=true; });
  const box=document.getElementById("dartRatio"); if(box) box.innerHTML=ratioCards(d, any);
  const msg=document.getElementById("dartMsg"); if(!msg) return;
  const ta=d.ca+d.nca, le=d.cl+d.ncl+d.eq;
  if(!any){ msg.innerHTML=""; return; }
  msg.innerHTML = ta===le
    ? `<div class="okbox">자산총계 ${won(ta)}원 = 부채와 자본 합계. 옮겨 적은 숫자가 서로 맞습니다.</div>`
    : `<div class="warnbox">자산총계(${won(ta)})와 부채·자본 합계(${won(le)})가 ${won(Math.abs(ta-le))}원 어긋납니다. 단위를 잘못 읽었거나 연결·별도를 섞었을 가능성이 큽니다.</div>`;
}
function buildDartReport(){
  const d=ns("dart"); const rows=(d.claims||[]).filter(r=>r.some(c=>c&&c.trim()));
  const fs=FS_FIELDS.map(f=>`  ${f.label} : ${d.fs&&d.fs[f.k]!=null?won(d.fs[f.k]):"(미기재)"}`).join("\n");
  return `■ 실제 기업 재무제표 검증 보고서
대상 기업 : ${d.co||"(미기재)"}

[1] 공시에서 옮긴 금액
${fs}

[2] 자료 없이 물었을 때와 자료를 주고 물었을 때의 차이
${d.compare||"(미기재)"}

[3] 주장 분해
${rows.length? rows.map((r,i)=>`(${i+1}) 주장 : ${r[0]}\n    판정 : ${r[1]}\n    대조한 실제 수치 : ${r[2]}\n    고쳐 쓴 문장 : ${r[3]}`).join("\n") : "(기록 없음)"}

[4] 내 결론
${d.conclusion||"(미기재)"}

[5] AI 사용 기록
${d.usage||"(미기재)"}`;
}

/* ---------- F2 계정과목·거래처 조회창 ---------- */
const LK = {el:document.getElementById("lookup"), list:document.getElementById("lkList"),
  search:document.getElementById("lkSearch"), title:document.getElementById("lkTitle"),
  target:null, items:[], view:[], idx:0};
function lkItems(kind){
  if(kind==="ptn") return PARTNERS.map(p=>({g:"거래처", n:p}));
  const out=[];
  for(const g in ACCOUNTS) ACCOUNTS[g].forEach(a=>out.push({g:g, n:a}));
  return out;
}
function openLookup(target){
  const kind = target.classList.contains("ptn") ? "ptn" : "acc";
  LK.target=target; LK.items=lkItems(kind);
  LK.title.textContent = kind==="ptn" ? "거래처 조회" : "계정과목 조회";
  LK.search.placeholder = kind==="ptn" ? "거래처 이름을 입력하세요" : "계정과목 이름이나 코드를 입력하세요";
  LK.search.value=""; LK.el.hidden=false;
  drawLookup(); LK.search.focus();
}
function closeLookup(){
  LK.el.hidden=true;
  if(LK.target){ const t=LK.target; LK.target=null; t.focus(); }
}
function drawLookup(){
  const q=LK.search.value.trim().toLowerCase();
  LK.view = q ? LK.items.filter(it=>it.n.toLowerCase().includes(q)) : LK.items.slice();
  LK.idx=0;
  if(!LK.view.length){ LK.list.innerHTML=`<li class="lkempty">검색 결과가 없습니다</li>`; return; }
  LK.list.innerHTML = LK.view.map((it,i)=>
    `<li role="option" data-i="${i}" aria-selected="${i===0}"><span class="g">${it.g}</span><span>${it.n}</span></li>`).join("");
}
function moveLookup(d){
  if(!LK.view.length) return;
  LK.idx=(LK.idx+d+LK.view.length)%LK.view.length;
  LK.list.querySelectorAll("li[role=option]").forEach((li,i)=>li.setAttribute("aria-selected", i===LK.idx));
  const cur=LK.list.querySelector('li[aria-selected="true"]');
  if(cur && cur.scrollIntoView) cur.scrollIntoView({block:"nearest"});
}
function pickLookup(i){
  const it=LK.view[i==null?LK.idx:i]; if(!it || !LK.target) return;
  const t=LK.target; t.value=it.n;
  t.dispatchEvent(new Event("change",{bubbles:true}));
  closeLookup();
}
LK.search.addEventListener("input", drawLookup);
LK.search.addEventListener("keydown", e=>{
  if(e.key==="ArrowDown"){ e.preventDefault(); moveLookup(1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); moveLookup(-1); }
  else if(e.key==="Enter"){ e.preventDefault(); pickLookup(); }
  else if(e.key==="Escape"){ e.preventDefault(); closeLookup(); }
});
LK.list.addEventListener("click", e=>{
  const li=e.target.closest("li[role=option]"); if(li) pickLookup(Number(li.dataset.i));
});
document.getElementById("lkClose").addEventListener("click", closeLookup);
document.getElementById("lkClear").addEventListener("click", ()=>{
  if(!LK.target) return; const t=LK.target; t.value="";
  t.dispatchEvent(new Event("change",{bubbles:true})); closeLookup();
});
LK.el.addEventListener("click", e=>{ if(e.target===LK.el) closeLookup(); });
const isLookupField = t => t && t.tagName==="SELECT" && t.classList && (t.classList.contains("acc")||t.classList.contains("ptn"));
view.addEventListener("mousedown", e=>{
  const t=e.target;
  if(!isLookupField(t)) return;
  if(window.matchMedia && window.matchMedia("(pointer:coarse)").matches) return;  /* 태블릿은 기본 목록 */
  e.preventDefault(); t.focus(); openLookup(t);
});
view.addEventListener("keydown", e=>{
  const t=e.target;
  if(e.key!=="F2" || !t || t.tagName!=="SELECT" || !t.classList) return;
  if(!t.classList.contains("acc") && !t.classList.contains("ptn")) return;
  e.preventDefault(); openLookup(t);
});

/* 헤더 버튼 */
const ZOOMS=[1,1.15,1.3,0.9];
function applyZoom(){
  const z=state.zoom||1, el=document.documentElement;
  const canZoom = window.CSS && CSS.supports && CSS.supports("zoom","1.2");
  if(canZoom) el.style.zoom = z===1 ? "" : String(z);
  else document.body.style.fontSize = z===1 ? "" : (15*z)+"px";
  const b=document.getElementById("sizeBtn");
  if(b) b.textContent = "화면 "+Math.round(z*100)+"%";
}
document.getElementById("sizeBtn").onclick = ()=>{
  const i=ZOOMS.indexOf(state.zoom||1);
  state.zoom = ZOOMS[(i+1)%ZOOMS.length]; save(); applyZoom(); setHeadH();
};
document.getElementById("themeBtn").onclick = ()=>{
  const cur = document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : cur==="light" ? "dark" :
    (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light":"dark");
  document.documentElement.setAttribute("data-theme", next); state.theme=next; save();
};
document.getElementById("resetBtn").onclick = ()=>{
  if(!confirm("입력한 답과 채점 결과를 모두 지웁니다. 계속할까요?")) return;
  state={step:state.step, res:{}, inputs:{}, fs:{}, essay:{}, theme:state.theme, zoom:state.zoom};
  save(); render();
};
function setHeadH(){
  const h=document.querySelector("header.top");
  if(h && h.offsetHeight>0) document.documentElement.style.setProperty("--headH", h.offsetHeight+"px");
}
window.addEventListener("resize", setHeadH);
if(window.ResizeObserver){ new ResizeObserver(setHeadH).observe(document.querySelector("header.top")); }
buildNav(); applyZoom(); setHeadH(); render();
</script>
