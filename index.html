<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>은또링쌤의 친절한 회계 교실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Jua&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEF3F6; --head:#E7F0F4; --head-2:#F3F7F9;
  --card:#FFFFFF; --card-2:#F5F7FA;
  --ink:#282D35; --ink-2:#5D656F; --ink-3:#9AA3AD;
  --rule:#E4E8EC; --rule-2:#F1F3F6;
  --brand:#4055E0; --brand-soft:#8F9CF0; --brand-bg:#EBEEFD;
  --teal:#32BFC0; --teal-bg:#E5F6F6;
  --tape-y:#FBE9A0; --tab-y:#FBF1C4; --tab-m:#CFE9E8;
  --ok:#1FA36E; --ok-bg:#E6F5EE;
  --rail:#4055E0;
  --shadow:0 1px 2px rgba(40,45,53,.04), 0 10px 24px -20px rgba(40,45,53,.5);
  --w:1060px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#111722; --head:#18212F; --head-2:#141C28;
    --card:#1A2130; --card-2:#222B3B;
    --ink:#EAEEF4; --ink-2:#A7B1BE; --ink-3:#78828F;
    --rule:#2B3447; --rule-2:#232B3A;
    --brand:#8C9CFF; --brand-soft:#5A6ACB; --brand-bg:#1F2743;
    --teal:#4FD3D3; --teal-bg:#153030;
    --tape-y:#8B7638; --tab-y:#3A3418; --tab-m:#1E3838;
    --ok:#4FC391; --ok-bg:#132C22;
    --rail:#8C9CFF;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 24px -20px #000;
  }
}
:root[data-theme="dark"]{
  --paper:#111722; --head:#18212F; --head-2:#141C28;
  --card:#1A2130; --card-2:#222B3B;
  --ink:#EAEEF4; --ink-2:#A7B1BE; --ink-3:#78828F;
  --rule:#2B3447; --rule-2:#232B3A;
  --brand:#8C9CFF; --brand-soft:#5A6ACB; --brand-bg:#1F2743;
  --teal:#4FD3D3; --teal-bg:#153030;
  --tape-y:#8B7638; --tab-y:#3A3418; --tab-m:#1E3838;
  --ok:#4FC391; --ok-bg:#132C22;
  --rail:#8C9CFF;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 24px -20px #000;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"Noto Sans KR",system-ui,-apple-system,"Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%;
  word-break:keep-all;overflow-wrap:break-word;line-break:strict}
h1,h2,h3{font-family:"Jua","Noto Sans KR",sans-serif;font-weight:400;margin:0;line-height:1.35}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--brand-soft);outline-offset:3px;border-radius:6px}
.hl{background:linear-gradient(transparent 55%, var(--tape-y) 55%);padding:0 4px;color:var(--ink)}

header.top{background:linear-gradient(180deg,var(--head) 0%,var(--head-2) 100%);border-bottom:1px solid var(--rule)}
.foldtab{max-width:var(--w);margin:0 auto;padding:7px 20px 0;display:flex;align-items:flex-end}
.foldtab span{background:var(--card);border-radius:10px 16px 0 0;padding:5px 20px 5px 16px;
  font-size:12.5px;font-weight:700;color:var(--ink-2);position:relative;z-index:3}
.foldtab i{display:block;height:22px;border-radius:4px 16px 0 0;margin-left:-14px}
.foldtab i.y{width:64px;background:var(--tab-y);z-index:2}
.foldtab i.m{width:64px;background:var(--tab-m);z-index:1}
.top-in{max-width:var(--w);margin:0 auto;padding:16px 20px 26px;display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.brand{margin-right:auto}
.brand b{display:block;font-family:"Jua",sans-serif;font-weight:400;font-size:28px;color:var(--brand)}
.brand p{margin:4px 0 0;font-size:13px;color:var(--ink-2)}
.iconbtn{background:var(--card);border:0;color:var(--ink-2);border-radius:999px;padding:7px 15px;
  font-size:12.5px;font-family:inherit;cursor:pointer;box-shadow:var(--shadow)}
.iconbtn:hover{color:var(--brand)}

main{max-width:var(--w);margin:0 auto;padding:30px 20px 70px}
.rail{height:12px;margin:0 0 26px;
  background:
    linear-gradient(var(--rail),var(--rail)) left center/1.5px 12px no-repeat,
    linear-gradient(var(--rail),var(--rail)) right center/1.5px 12px no-repeat,
    radial-gradient(circle, var(--rail) 2.6px, rgba(0,0,0,0) 3px) center/14px 14px no-repeat,
    linear-gradient(var(--rail),var(--rail)) center/100% 1.5px no-repeat;
  opacity:.6}
.secttl{display:flex;align-items:baseline;gap:10px;margin:0 0 14px}
.secttl h2{font-size:20px;color:var(--ink)}
.secttl span{font-size:12.5px;color:var(--ink-3)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.item{display:flex;flex-direction:column;background:var(--card);border-radius:18px;padding:20px 20px 18px;
  box-shadow:var(--shadow);transition:transform .16s ease, box-shadow .16s ease;height:100%}
a.item:hover{transform:translateY(-4px);box-shadow:0 0 0 2px var(--brand), 0 18px 32px -24px rgba(40,45,53,.8)}
.item .no{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;color:var(--brand-soft);letter-spacing:.04em}
.item h3{font-size:17.5px;margin:6px 0 8px;color:var(--ink)}
.item p{margin:0 0 14px;font-size:13px;color:var(--ink-2);flex:1}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tags span{font-size:11.5px;color:var(--ink-2);background:var(--card-2);border-radius:999px;padding:3px 10px}
.foot{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--rule-2);padding-top:11px}
.badge{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 11px}
.badge.open{color:#fff;background:var(--brand)}
.badge.soon{color:var(--ink-3);background:var(--card-2)}
:root[data-theme="dark"] .badge.open{color:#141B28}
.go{font-size:12.5px;font-weight:700;color:var(--brand)}
.item.soon{opacity:.62}
.item.soon h3{color:var(--ink-2)}

.guide{margin-top:34px;background:var(--card-2);border-radius:18px;padding:22px 22px 20px;position:relative}
.guide::before{content:"안내";position:absolute;top:-12px;left:18px;background:var(--card);
  border:1.5px solid var(--brand);color:var(--brand);font-weight:700;font-size:11px;
  padding:2px 12px;border-radius:7px 7px 7px 0}
.guide ul{margin:6px 0 0;padding-left:19px;font-size:13px;color:var(--ink-2)}
.guide li{margin-bottom:6px}
footer{max-width:var(--w);margin:0 auto;padding:0 20px 46px;font-size:12px;color:var(--ink-3)}
@media(max-width:600px){.brand b{font-size:23px}.grid{grid-template-columns:1fr}}
@media (pointer:coarse){.iconbtn{padding:11px 18px;font-size:14px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="foldtab"><span>회계 교실</span><i class="y"></i><i class="m"></i></div>
  <div class="top-in">
    <div class="brand">
      <b>은또링쌤의 친절한 <span class="hl">회계 교실</span></b>
      <p>한국디지털미디어고등학교 e-비즈니스과 · 회계원리 &amp; 회계실무 수업 자료</p>
    </div>
    <button class="iconbtn" id="themeBtn" type="button">화면 전환</button>
  </div>
</header>

<main>
  <div class="rail"></div>
  <div class="secttl"><h2>수업 자료</h2><span id="count"></span></div>
  <div class="grid" id="grid"></div>

  <div class="guide">
    <ul>
      <li>웹앱은 설치 없이 브라우저에서 바로 열립니다. 태블릿과 컴퓨터 모두 사용할 수 있어요.</li>
      <li>입력한 답과 채점 결과는 <b>사용하는 기기에 저장</b>됩니다. 다른 기기나 시크릿 창에서는 이어지지 않습니다.</li>
      <li>제출은 각 자료 안의 &lsquo;모아서 복사&rsquo; 버튼을 눌러 과제 창에 붙여넣으세요.</li>
    </ul>
  </div>
</main>
<footer>수업 중 오류나 개선할 점을 발견하면 선생님께 알려 주세요.</footer>

<script>
"use strict";
/* ─────────────────────────────────────────────
   자료 목록 — 여기만 고치면 목차가 바뀝니다.
   file : 같은 폴더의 파일 이름. 아직 없으면 "" 로 두세요(준비 중으로 표시됩니다).
   ───────────────────────────────────────────── */
const ITEMS = [
  {
    title:"제20회 실기 모의문제 실습",
    file:"splus-20.html",
    desc:"현주전자(주)의 8월 거래를 기준정보부터 결산·조회까지 입력하고, 재무제표 분석과 AI 감사 활동까지 이어집니다.",
    tags:["웹앱","New sPLUS","3학년 회계실무"]
  },
  /* ↓ 아래는 예시입니다. 실제 자료를 올릴 때 제목·파일명을 바꾸거나 통째로 지우세요. */
  {
    title:"제21회 실기 모의문제 실습",
    file:"",
    desc:"다음 회차 모의문제 실습 자료입니다.",
    tags:["웹앱","New sPLUS"]
  },
  {
    title:"회계원리 기초 학습지",
    file:"",
    desc:"2학년 회계원리 복습용 학습지입니다.",
    tags:["학습지","2학년"]
  }
];

const grid=document.getElementById("grid");
grid.innerHTML = ITEMS.map((it,i)=>{
  const no=String(i+1).padStart(2,"0");
  const tags=(it.tags||[]).map(t=>`<span>${t}</span>`).join("");
  const inner=`<div class="no">${no}</div><h3>${it.title}</h3><p>${it.desc||""}</p>
    <div class="tags">${tags}</div>
    <div class="foot"><span class="badge ${it.file?"open":"soon"}">${it.file?"공개":"준비 중"}</span>
      ${it.file?`<span class="go">열기 →</span>`:""}</div>`;
  return it.file
    ? `<a class="item" href="${it.file}">${inner}</a>`
    : `<div class="item soon">${inner}</div>`;
}).join("");
document.getElementById("count").textContent = ITEMS.filter(i=>i.file).length + "개 공개 · 전체 " + ITEMS.length + "개";

const KEY="accclass_theme";
try{ const t=localStorage.getItem(KEY); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}
document.getElementById("themeBtn").onclick=()=>{
  const cur=document.documentElement.getAttribute("data-theme");
  const next = cur==="dark" ? "light" : cur==="light" ? "dark"
    : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark");
  document.documentElement.setAttribute("data-theme",next);
  try{ localStorage.setItem(KEY,next); }catch(e){}
};
</script>
</body>
</html>
